spring:
  application:
    name: fynavero
  datasource:
    url: ${DATABASE_URL:jdbc:h2:file:./data/fynavero;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH}
    username: ${DATABASE_USER:sa}
    password: ${DATABASE_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
  jackson:
    default-property-inclusion: non_null
  servlet:
    multipart:
      enabled: false # a API não recebe arquivos: planilhas são lidas no navegador
  # Em desenvolvimento as sessões ficam na memória; o perfil "postgres" (produção) liga as sessões no banco.
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.session.SessionAutoConfiguration
  session:
    jdbc:
      initialize-schema: never # tabelas criadas pelo Flyway (V5)
      cleanup-cron: "0 */15 * * * *"
  mail:
    # SPRING_MAIL_HOST, SPRING_MAIL_PORT, SPRING_MAIL_USERNAME e SPRING_MAIL_PASSWORD ligam o envio (Brevo, Resend, SES…).
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.connectiontimeout: 10000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000

server:
  port: ${PORT:8080}
  # Atrás do proxy da hospedagem use "framework" para ler o IP real (X-Forwarded-For) e o HTTPS.
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:none}
  error:
    include-message: never
    include-stacktrace: never
    include-exception: false
    whitelabel:
      enabled: false
  servlet:
    session:
      timeout: 30d
      cookie:
        name: FYN_SESSION
        http-only: true
        same-site: lax
        secure: ${COOKIE_SECURE:false}
        max-age: 30d

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

app:
  # URL pública do front-end (links mágicos e retorno do login com Google).
  base-url: ${APP_BASE_URL:http://localhost:5180}
  zone: America/Sao_Paulo
  demo-data: ${DEMO_DATA:true}
  mail-from: ${MAIL_FROM:Fynavero <nao-responda@fynavero.local>}
  # Sem servidor de e-mail, o conteúdo (com os links) vai para o log só em desenvolvimento.
  log-mail-content: ${LOG_MAIL_CONTENT:true}

logging:
  level:
    org.hibernate.SQL: warn

---
# Produção: PostgreSQL + sessões no banco. DATABASE_URL aceita jdbc:postgresql://… ou postgres://usuario:senha@host/banco.
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/fynavero}
    username: ${DATABASE_USER:fynavero}
    password: ${DATABASE_PASSWORD:fynavero}
    hikari:
      maximum-pool-size: ${DATABASE_POOL_SIZE:5}
  autoconfigure:
    exclude: ""
app:
  demo-data: ${DEMO_DATA:false}
  log-mail-content: ${LOG_MAIL_CONTENT:false}
