# Blueprint da Render: cria o app (Docker) e o PostgreSQL de uma vez.
# Na Render: New › Blueprint › escolha este repositório. Depois preencha as variáveis marcadas como sync: false.
# Planos GRÁTIS, só para testar: o site dorme após ~15 min sem visitas (os e-mails das 8h podem não sair)
# e o banco grátis expira em ~30 dias. Antes de abrir para pessoas de verdade, troque no painel da Render:
# site para "starter" e banco para "basic-256mb" (ou mude aqui e publique). Confira em render.com/pricing.
services:
  - type: web
    name: fynavero
    runtime: docker
    plan: free
    healthCheckPath: /actuator/health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: fynavero-db
          property: connectionString
      - key: APP_BASE_URL # ex.: https://fynavero.onrender.com ou https://app.seudominio.com.br
        sync: false
      - key: MAIL_FROM # ex.: Fynavero <nao-responda@seudominio.com.br>
        sync: false
      - key: SPRING_MAIL_HOST # Brevo: smtp-relay.brevo.com · Resend: smtp.resend.com
        sync: false
      - key: SPRING_MAIL_PORT
        value: "587"
      - key: SPRING_MAIL_USERNAME
        sync: false
      - key: SPRING_MAIL_PASSWORD
        sync: false
      - key: DEMO_DATA
        value: "false"

databases:
  - name: fynavero-db
    plan: free
    databaseName: fynavero
    user: fynavero
